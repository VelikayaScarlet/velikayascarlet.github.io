name: GPU weekly usage
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpu-weekly-usage
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Compute weekly totals
        run: |
          set -eu
          branch=refs/heads/gpu-usage-data
          ref=$(git ls-remote --heads origin "$branch")
          if [ -n "$ref" ]; then
            git fetch --depth=1 origin "$branch"
            git show FETCH_HEAD:weekly.json > "$RUNNER_TEMP/gpu-previous.json"
          fi
          python3 scripts/gpu-weekly-usage.py "$RUNNER_TEMP/gpu-previous.json" "$RUNNER_TEMP/gpu-weekly.json"
          if [ -n "$ref" ]; then
            git switch --detach FETCH_HEAD
          else
            git switch --orphan gpu-usage-data
          fi
          cp "$RUNNER_TEMP/gpu-weekly.json" weekly.json
          git add weekly.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GPU weekly totals"
          git push origin HEAD:"$branch"
