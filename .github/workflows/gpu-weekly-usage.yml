name: GPU weekly usage
run-name: GPU weekly usage (${{ inputs.source || github.event_name }})
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gpu-weekly-usage.yml'
      - 'scripts/gpu-weekly-usage.py'
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Sampling trigger
        type: choice
        options: [manual, cloudflare]
        default: manual

permissions:
  contents: write

concurrency:
  group: gpu-weekly-usage
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.GPU_EXTERNAL_SCHEDULER != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Compute weekly totals
        env:
          GPU_SAMPLE_MINUTES: ${{ (inputs.source == 'cloudflare' || vars.GPU_EXTERNAL_SCHEDULER == 'true') && '3' || '5' }}
        run: |
          set -eu
          branch=refs/heads/gpu-usage-data
          ref=$(git ls-remote --heads origin "$branch")
          if [ -n "$ref" ]; then
            git fetch --depth=1 origin "$branch"
            git show FETCH_HEAD:weekly.json > "$RUNNER_TEMP/gpu-previous.json"
          fi
          python3 scripts/gpu-weekly-usage.py "$RUNNER_TEMP/gpu-previous.json" "$RUNNER_TEMP/gpu-weekly.json"
          if [ -n "$ref" ]; then
            git switch --detach FETCH_HEAD
          else
            git switch --orphan gpu-usage-data
          fi
          cp "$RUNNER_TEMP/gpu-weekly.json" weekly.json
          git add weekly.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GPU weekly totals"
          git push origin HEAD:"$branch"
