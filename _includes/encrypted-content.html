<div class="encrypted-content" data-payload-url="{{ include.payload | relative_url }}">
  <div class="encrypted-content__prompt">
    <div class="encrypted-content__emblem" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="11" width="14" height="9.5" rx="2.5"/>
        <path d="M8.5 11V7.5a3.5 3.5 0 1 1 7 0V11"/>
      </svg>
    </div>
    <h2>{{ include.title | default: "受保护内容" }}</h2>
    <p class="encrypted-content__hint">此篇章已加密，请输入访问密码以展开阅读</p>
    <form class="encrypted-content__form">
      <div class="encrypted-content__field">
        <input class="encrypted-content__password" type="password" autocomplete="current-password" placeholder="输入密码" required>
        <button class="encrypted-content__toggle" type="button" aria-label="显示密码" aria-pressed="false" title="显示/隐藏密码">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 10s2.8-5 7.5-5 7.5 5 7.5 5-2.8 5-7.5 5-7.5-5-7.5-5Z"/><circle cx="10" cy="10" r="2.2"/></svg>
        </button>
      </div>
      <button class="encrypted-content__submit" type="submit">解密阅读</button>
    </form>
    <p class="encrypted-content__status" role="status"></p>
  </div>
  <div class="encrypted-content__body" hidden></div>
</div>

<style>
.encrypted-content__prompt {
  max-width: 400px;
  margin: 2rem auto 2.5rem;
  padding: 2rem 1.85rem 1.6rem;
  border-radius: 16px;
  border: 1px solid var(--creation-line, #d8d2c6);
  background: var(--creation-paper, #fffdf9);
  box-shadow: 0 12px 32px -14px rgba(32, 43, 50, 0.14);
  text-align: center;
  font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
}
.encrypted-content__emblem {
  width: 46px;
  height: 46px;
  margin: 0 auto 0.9rem;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: var(--creation-accent, #b12f24);
  background: color-mix(in srgb, var(--creation-accent, #b12f24) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--creation-accent, #b12f24) 24%, transparent);
}
.encrypted-content__prompt h2 {
  margin: 0 0 0.35rem;
  color: var(--creation-ink, #20242a);
  font-family: var(--folio-literary, "Noto Serif SC", Georgia, serif);
  font-size: 1.38rem;
  font-weight: 600;
}
.encrypted-content__hint {
  margin: 0;
  color: var(--creation-muted, #68717c);
  font-size: 0.86rem;
}
.encrypted-content__form {
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  margin-top: 1.35rem;
}
.encrypted-content__field {
  position: relative;
  display: flex;
  align-items: center;
}
.encrypted-content__password {
  width: 100%;
  min-width: 0;
  height: 44px;
  padding: 0 2.6rem 0 0.9rem;
  border: 1px solid var(--creation-line, #d4dae0);
  border-radius: 10px;
  color: var(--creation-ink, #20242a);
  background: transparent;
  font: inherit;
  font-size: 0.94rem;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
.encrypted-content__password:focus {
  outline: none;
  border-color: var(--creation-accent, #b12f24);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--creation-accent, #b12f24) 16%, transparent);
}
.encrypted-content__toggle {
  position: absolute;
  right: 0.4rem;
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--creation-muted, #68717c);
  display: grid;
  place-items: center;
  cursor: pointer;
}
.encrypted-content__toggle:hover {
  color: var(--creation-ink, #20242a);
}
.encrypted-content__submit {
  height: 44px;
  padding: 0 1.1rem;
  border: 0;
  border-radius: 10px;
  background: var(--creation-accent, #b12f24);
  color: #fff;
  cursor: pointer;
  font: inherit;
  font-size: 0.92rem;
  font-weight: 600;
  transition: transform 150ms ease, filter 150ms ease;
}
.encrypted-content__submit:hover {
  filter: brightness(1.06);
  transform: translateY(-1px);
}
.encrypted-content__status {
  min-height: 1.4em;
  margin: 0.65rem 0 0;
  font-size: 0.83rem;
  color: var(--creation-accent, #b12f24) !important;
}
.encrypted-content__prompt.is-shaking {
  animation: enc-shake 320ms ease;
}
@keyframes enc-shake {
  0%, 100% { transform: translateX(0); }
  22% { transform: translateX(-6px); }
  50% { transform: translateX(5px); }
  78% { transform: translateX(-3px); }
}
</style>

<script>
(function () {
  const container = document.currentScript.previousElementSibling.previousElementSibling;
  const form = container.querySelector(".encrypted-content__form");
  const input = container.querySelector(".encrypted-content__password");
  const toggle = container.querySelector(".encrypted-content__toggle");
  const status = container.querySelector(".encrypted-content__status");
  const prompt = container.querySelector(".encrypted-content__prompt");
  const body = container.querySelector(".encrypted-content__body");
  const payloadUrl = container.dataset.payloadUrl;

  if (toggle) {
    toggle.addEventListener("click", () => {
      const shown = input.type === "text";
      input.type = shown ? "password" : "text";
      toggle.setAttribute("aria-pressed", String(!shown));
      toggle.setAttribute("aria-label", shown ? "显示密码" : "隐藏密码");
      input.focus();
    });
  }

  function fromBase64(value) {
    return Uint8Array.from(atob(value), (character) => character.charCodeAt(0));
  }

  async function deriveKey(password, payload) {
    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(password),
      "PBKDF2",
      false,
      ["deriveKey"],
    );

    return crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        hash: "SHA-256",
        salt: fromBase64(payload.salt),
        iterations: payload.iterations,
      },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"],
    );
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    status.textContent = "正在解密……";

    try {
      const response = await fetch(payloadUrl, { cache: "no-store" });
      if (!response.ok) throw new Error("Unable to load encrypted content");
      const payload = await response.json();
      const key = await deriveKey(input.value, payload);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(payload.iv) },
        key,
        fromBase64(payload.ciphertext),
      );

      body.innerHTML = new TextDecoder().decode(plaintext);
      body.hidden = false;
      prompt.remove();
    } catch (error) {
      status.textContent = "密码错误，或加密内容无法读取。";
      prompt.classList.remove("is-shaking");
      void prompt.offsetWidth;
      prompt.classList.add("is-shaking");
      input.select();
    }
  });
})();
</script>
