<script>
  document.addEventListener("DOMContentLoaded", function () {
    var countElement = document.getElementById("profile-views-count");
    if (!countElement) return;

    var dataUrl = "https://raw.githubusercontent.com/{{ site.repository }}/profile-views/profile_views.json";
    fetch(dataUrl, { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) throw new Error("Profile views request failed");
        return response.json();
      })
      .then(function (data) {
        if (Number.isFinite(data.total_pageviews)) {
          countElement.textContent = data.total_pageviews.toLocaleString("en-US");
        }
      })
      .catch(function () {
        countElement.textContent = "Unavailable";
      });
  });
</script>
