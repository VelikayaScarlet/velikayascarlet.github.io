---
layout: compress
---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Curriculum Vitae | Tian Lan</title>
    <meta name="description" content="Tian Lan's curriculum vitae: education, research interests, selected publications, awards, and skills.">
    <link rel="icon" type="image/png" href="{{ '/images/favicon-32x32.png' | relative_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: #111;
        background:
          radial-gradient(640px 360px at 15% 0%, rgba(56, 97, 138, 0.07), transparent 70%),
          radial-gradient(520px 320px at 85% 4%, rgba(180, 146, 102, 0.07), transparent 70%),
          #eceff2;
        font: 15px/1.28 "Sitka Text", Georgia, serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Floating Top Toolbar */
      .cv-toolbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(236, 239, 242, 0.82);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(17, 24, 39, 0.08);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .cv-toolbar__inner {
        max-width: 850px;
        margin: 0 auto;
        padding: 12px 4px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .cv-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px 7px 8px;
        border-radius: 999px;
        color: #334155;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        transition: background-color 160ms ease, color 160ms ease;
      }
      .cv-back:hover {
        background: rgba(15, 23, 42, 0.06);
        color: #0f172a;
        text-decoration: none;
      }
      .cv-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .cv-print {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid rgba(15, 23, 42, 0.14);
        border-radius: 999px;
        padding: 7px 15px;
        background: #ffffff;
        color: #1e293b;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease, background-color 150ms ease;
      }
      .cv-print:hover {
        background: #f8fafc;
        border-color: rgba(15, 23, 42, 0.24);
        box-shadow: 0 4px 12px -4px rgba(15, 23, 42, 0.14);
        transform: translateY(-1px);
      }
      .cv-print svg { width: 15px; height: 15px; }

      /* A4 Paper Sheet */
      .cv-document {
        max-width: 850px;
        margin: 26px auto 54px;
        padding: 46px 54px 48px;
        background: #ffffff;
        border-radius: 6px;
        border: 1px solid rgba(15, 23, 42, 0.07);
        box-shadow:
          0 22px 50px -20px rgba(15, 23, 42, 0.16),
          0 4px 14px -4px rgba(15, 23, 42, 0.06);
      }

      h1 { margin: 0 0 5px; text-align: center; font-size: 27px; line-height: 1.2; font-weight: 700; }
      h1 + p { margin: 0 0 22px; text-align: center; color: #111; font-size: 14px; line-height: 1.45; }
      h2 { margin: 18px 0 5px; padding: 0 0 2px; border-bottom: 2px solid #111; font-size: 16px; line-height: 1.05; font-weight: 700; text-transform: uppercase; }
      h3 { margin: 5px 0 2px; font-size: 15px; font-weight: 700; }
      p { margin: 2px 0 7px; }
      a { color: #075db1; text-decoration: none; overflow-wrap: anywhere; }
      a:hover { text-decoration: underline; }
      h1 + p a { text-decoration: underline; text-underline-offset: 2px; }
      .cv-entry-title { float: left; max-width: 68%; margin: 5px 0 1px; }
      .cv-date { margin: 5px 0 1px; text-align: right; color: #111; font-size: 14px; }
      .cv-date + p { clear: both; margin-bottom: 8px; }
      .cv-date + p::first-line { font-style: italic; }
      ul { margin: 3px 0 8px; padding-left: 17px; }
      li { margin: 0 0 7px; padding-left: 2px; }
      table { width: 100%; border-collapse: collapse; font-size: 15px; }
      th { display: none; }
      td { padding: 2px 0; vertical-align: top; }
      td:last-child { padding-left: 20px; white-space: nowrap; }

      @media (prefers-color-scheme: dark) {
        body {
          background:
            radial-gradient(640px 360px at 15% 0%, rgba(129, 140, 248, 0.12), transparent 70%),
            radial-gradient(520px 320px at 85% 4%, rgba(56, 189, 248, 0.08), transparent 70%),
            #151821;
        }
        .cv-toolbar {
          background: rgba(21, 24, 33, 0.82);
          border-bottom-color: rgba(255, 255, 255, 0.08);
        }
        .cv-back { color: #cbd5e1; }
        .cv-back:hover { background: rgba(255, 255, 255, 0.08); color: #f8fafc; }
        .cv-print {
          background: #232836;
          color: #f1f5f9;
          border-color: rgba(255, 255, 255, 0.14);
        }
        .cv-print:hover {
          background: #2c3345;
          border-color: rgba(255, 255, 255, 0.24);
        }
        .cv-document {
          border-color: rgba(255, 255, 255, 0.08);
          box-shadow: 0 28px 64px -18px rgba(0, 0, 0, 0.65);
        }
      }

      @media (max-width: 880px) {
        .cv-toolbar__inner { padding: 11px 18px; }
      }

      @media (max-width: 620px) {
        body { background: #fff; font-size: 14px; }
        .cv-document { padding: 24px 20px 32px; margin: 0; border: 0; border-radius: 0; box-shadow: none; }
        h1 { font-size: 26px; }
        h2 { font-size: 15px; }
        h3 { font-size: 14px; }
        .cv-entry-title { float: none; max-width: none; }
        .cv-date { text-align: left; margin: 0 0 3px; font-size: 13px; }
        table { font-size: 14px; }
      }

      @page { size: A4; margin: 15mm 17mm; }
      @media print {
        body { background: #fff; color: #000; font-family: "Sitka Text", Georgia, serif; font-size: 10pt; line-height: 1.17; }
        .cv-toolbar { display: none !important; }
        .cv-document { width: auto; max-width: none; margin: 0; padding: 0; border: 0; border-radius: 0; box-shadow: none; }
        h1 { font-size: 18pt; margin: 0 0 3pt; }
        h1 + p { font-size: 10pt; line-height: 1.25; margin: 0 0 11pt; color: #000; }
        h2 { font-size: 11pt; margin: 9pt 0 3pt; padding-bottom: 1pt; border-bottom: 1.2pt solid #111; break-after: avoid; page-break-after: avoid; }
        h3 { font-size: 10pt; margin: 3pt 0 1pt; break-after: avoid; page-break-after: avoid; }
        p { margin: 1pt 0 4pt; orphans: 2; widows: 2; }
        .cv-entry-title { float: left; max-width: 70%; margin: 3pt 0 1pt; }
        .cv-date { text-align: right; color: #000; font-size: 10pt; margin: 3pt 0 1pt; }
        .cv-date + p { margin-bottom: 5pt; }
        ul { margin: 2pt 0 4pt; padding-left: 12pt; }
        li { margin-bottom: 4pt; break-inside: avoid; page-break-inside: avoid; }
        table { font-size: 10pt; }
        tr { break-inside: avoid; }
        td { padding: 1pt 0; }
        a { color: #000; text-decoration: none; }
      }
    </style>
  </head>
  <body>
    <nav class="cv-toolbar" aria-label="CV actions">
      <div class="cv-toolbar__inner">
        <a class="cv-back" href="{{ '/' | relative_url }}">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 15L7.5 10l5-5"/></svg>
          <span>Back to homepage</span>
        </a>
        <div class="cv-actions">
          <button class="cv-print" type="button" onclick="window.print()">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6zM18 12h.01"/></svg>
            Print / Save PDF
          </button>
        </div>
      </div>
    </nav>
    <main class="cv-document">{{ content }}</main>
  </body>
</html>
