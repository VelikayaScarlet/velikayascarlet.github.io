---
layout: compress
---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Curriculum Vitae | Tian Lan</title>
    <meta name="description" content="Tian Lan's curriculum vitae: education, research interests, selected publications, awards, and skills.">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #24282c; background: #f3f5f6; font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .cv-toolbar { max-width: 930px; margin: 24px auto 18px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .cv-toolbar a { color: #485761; text-decoration: none; font-size: 13px; }
      .cv-toolbar a:hover { text-decoration: underline; }
      .cv-actions { display: flex; align-items: center; gap: 20px; }
      .cv-print { display: inline-flex; align-items: center; gap: 8px; border: 1px solid #bfcbd1; border-radius: 5px; padding: 9px 14px; background: #fff; color: #253e4b; font: inherit; font-size: 13px; cursor: pointer; }
      .cv-print:hover { background: #eaf0f3; }
      .cv-print svg { width: 17px; height: 17px; }
      .cv-document { max-width: 886px; margin: 0 auto 48px; padding: 48px 56px; background: white; border: 1px solid #e0e5e8; }
      h1 { margin: 0 0 5px; font-size: 32px; line-height: 1.2; font-weight: 650; }
      h1 + p { margin-top: 10px; color: #56636b; }
      h2 { margin: 26px 0 12px; padding-bottom: 5px; border-bottom: 1px solid #aab6be; font-size: 14px; font-weight: 700; text-transform: uppercase; }
      h3 { margin: 12px 0 4px; font-size: 14px; font-weight: 650; }
      p { margin: 5px 0 12px; }
      a { color: #2c617b; text-decoration: none; overflow-wrap: anywhere; }
      a:hover { text-decoration: underline; }
      .cv-entry-title { float: left; max-width: 68%; margin: 8px 0 3px; }
      .cv-date { margin: 8px 0 3px; text-align: right; color: #5a6670; font-size: 13px; }
      .cv-date + p { clear: both; }
      ul { margin: 6px 0 12px; padding-left: 19px; }
      li { margin: 0 0 9px; padding-left: 2px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th { display: none; }
      td { padding: 3px 0; vertical-align: top; }
      td:last-child { padding-left: 20px; white-space: nowrap; }
      @media (max-width: 620px) {
        body { background: #fff; font-size: 14px; }
        .cv-toolbar { margin: 16px 0; padding: 0 18px; }
        .cv-actions { gap: 12px; }
        .cv-document { padding: 22px 20px 36px; margin: 0; border: 0; }
        h1 { font-size: 28px; }
        .cv-entry-title { float: none; max-width: none; }
        .cv-date { text-align: left; margin: 0 0 4px; }
      }
      @page { size: A4; margin: 15mm 17mm; }
      @media print {
        body { background: #fff; color: #000; font-family: "Times New Roman", Times, serif; font-size: 10pt; line-height: 1.18; }
        .cv-toolbar { display: none !important; }
        .cv-document { width: auto; max-width: none; padding: 0; margin: 0; border: 0; }
        h1 { font-size: 22pt; margin: 0 0 3pt; }
        h1 + p { margin: 3pt 0 8pt; color: #000; }
        h2 { font-size: 11pt; margin: 10pt 0 5pt; padding-bottom: 3pt; border-color: #333; break-after: avoid; page-break-after: avoid; }
        h3 { font-size: 10pt; margin: 4pt 0 2pt; break-after: avoid; page-break-after: avoid; }
        p { margin: 2pt 0 5pt; orphans: 2; widows: 2; }
        .cv-entry-title { float: left; max-width: 70%; margin: 4pt 0 2pt; }
        .cv-date { text-align: right; margin: 4pt 0 2pt; color: #000; font-size: 10pt; }
        ul { margin: 3pt 0 5pt; padding-left: 13pt; }
        li { margin-bottom: 4pt; break-inside: avoid; page-break-inside: avoid; }
        a { color: #000; text-decoration: none; }
        table { font-size: 10pt; }
        tr { break-inside: avoid; }
        td { padding: 1.5pt 0; }
      }
      /* Compact CV layout, shared with the local preview. */
      body { color: #111; background: #eceeef; font-family: "Sitka Text", Georgia, serif; font-size: 15px; line-height: 1.28; }
      .cv-toolbar { max-width: 850px; margin: 20px auto 14px; font-family: Arial, sans-serif; }
      .cv-document { max-width: 850px; padding: 42px 52px 44px; border: 0; box-shadow: 0 2px 14px rgba(0,0,0,.05); }
      h1 { margin: 0 0 5px; text-align: center; font-size: 27px; font-weight: 700; }
      h1 + p { margin: 0 0 22px; text-align: center; color: #111; font-size: 14px; line-height: 1.45; }
      h2 { margin: 18px 0 5px; padding: 0 0 2px; border-bottom: 2px solid #111; font-size: 16px; line-height: 1.05; font-weight: 700; }
      h3 { margin: 5px 0 2px; font-size: 15px; font-weight: 700; }
      p { margin: 2px 0 7px; }
      a { color: #075db1; }
      h1 + p a { text-decoration: underline; text-underline-offset: 2px; }
      .cv-entry-title { margin: 5px 0 1px; }
      .cv-date { margin: 5px 0 1px; color: #111; font-size: 14px; }
      .cv-date + p { margin-bottom: 8px; }
      .cv-date + p::first-line { font-style: italic; }
      ul { margin: 3px 0 8px; padding-left: 17px; }
      li { margin: 0 0 7px; padding-left: 2px; }
      table { font-size: 15px; }
      td { padding: 2px 0; }
      @media (max-width: 620px) {
        body { background: #fff; font-size: 14px; }
        .cv-document { padding: 24px 20px 32px; box-shadow: none; }
        h1 { font-size: 26px; }
        h2 { font-size: 15px; }
        h3 { font-size: 14px; }
        .cv-date { margin: 0 0 3px; font-size: 13px; }
        table { font-size: 14px; }
      }
      @page { size: A4; margin: 15mm 17mm; }
      @media print {
        body { background: #fff; font-family: "Sitka Text", Georgia, serif; font-size: 10pt; line-height: 1.17; }
        .cv-document { width: auto; max-width: none; margin: 0; padding: 0; border: 0; box-shadow: none; }
        h1 { font-size: 18pt; margin-bottom: 3pt; }
        h1 + p { font-size: 10pt; line-height: 1.25; margin: 0 0 11pt; }
        h2 { font-size: 11pt; margin: 9pt 0 3pt; padding-bottom: 1pt; border-bottom: 1.2pt solid #111; }
        h3 { font-size: 10pt; margin: 3pt 0 1pt; }
        p { margin: 1pt 0 4pt; }
        .cv-entry-title { margin: 3pt 0 1pt; }
        .cv-date { font-size: 10pt; margin: 3pt 0 1pt; }
        .cv-date + p { margin-bottom: 5pt; }
        ul { margin: 2pt 0 4pt; padding-left: 12pt; }
        li { margin-bottom: 4pt; }
        table { font-size: 10pt; }
        td { padding: 1pt 0; }
        a { color: #000; }
      }
    </style>
  </head>
  <body>
    <nav class="cv-toolbar" aria-label="CV actions">
      <a href="{{ '/' | relative_url }}">Back to homepage</a>
      <div class="cv-actions">
        <a href="{{ '/creations/CVEN.pdf' | relative_url }}">Original PDF</a>
        <button class="cv-print" type="button" onclick="window.print()">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6zM18 12h.01"/></svg>
          Print / Save PDF
        </button>
      </div>
    </nav>
    <main class="cv-document">{{ content }}</main>
  </body>
</html>
